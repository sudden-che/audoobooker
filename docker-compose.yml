services:

  audiobooker-both:
    image: suddenche/priv:audiobooker-main-latest
    environment:
      MODE: both
      BOT_TOKEN: ${BOT_TOKEN}
      TTS_ENGINE: qwen3
      WEB_TTS_ENGINE: qwen3
      QWEN3_MODEL_ID: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      QWEN3_SPEAKER: Serena
      QWEN3_LANGUAGE: Russian
      VOICE: ru-RU-SvetlanaNeural
      SPEED: +18%
      CHUNK_SIZE: "4000"
      MAX_CONCURRENT_TASKS: "8"
      MAX_CONCURRENT_REQUESTS: "2"
      MAX_CONCURRENT_UPDATES: "4"
      FORWARD_GROUP_DEBOUNCE_SECONDS: "1.8"
      FFMPEG_PATH: ffmpeg
      MERGE_CHUNKS: "true"
      DELIVERY_MODE: ${DELIVERY_MODE:-auto}
      DOWNLOAD_DIR: /app/data/downloads
      DOWNLOAD_TTL_SECONDS: ${DOWNLOAD_TTL_SECONDS:-900}
      DOWNLOAD_TTL_MINUTES: ${DOWNLOAD_TTL_MINUTES:-}
      DOWNLOAD_SERVER_HOST: 0.0.0.0
      DOWNLOAD_SERVER_PORT: ${DOWNLOAD_SERVER_PORT:-43561}
      DOWNLOAD_SERVER_IDLE_GRACE_SECONDS: ${DOWNLOAD_SERVER_IDLE_GRACE_SECONDS:-5}
      PUBLIC_DOWNLOAD_BASE_URL: ${PUBLIC_DOWNLOAD_BASE_URL:-http://localhost:43561}
      TELEGRAM_SAFE_UPLOAD_BYTES: ${TELEGRAM_SAFE_UPLOAD_BYTES:-51380224}
      MAX_TEXT_FROM_MESSAGE: "50000"
      CHECK_TTS_DEPS_ON_START: "true"
      AUTO_UPDATE_TTS_DEPS: "true"
      WEB_HOST: 0.0.0.0 # Changed from 127.0.0.1 to allow access inside container
      WEB_PORT: "8000"
      BOT_DATA_PATH: /app/data/bot_data.pickle
    volumes:
      - audiobooker_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
      - "0.0.0.0:${DOWNLOAD_SERVER_PORT:-43561}:${DOWNLOAD_SERVER_PORT:-43561}"
    restart: unless-stopped

  # paperboy:
  #   image: suddenche/priv:paperboy-main-latest
  #   container_name: paperboy
  #   restart: unless-stopped
  #   volumes:
  #     - paperboy_config:/app/config
  #   environment:
  #     - PYTHONUNBUFFERED=1

volumes:
  audiobooker_data:
